# electron-builder configuration
# Docs: https://www.electron.build/configuration/configuration

appId: org.fluxer.World
productName: Chat
executableName: fluxer-world
copyright: Copyright © 2026 Fluxer Contributors

# Where electron-builder will find build resources (icons, entitlements, etc.)
directories:
  buildResources: assets
  output: release

# ── Files to bundle inside the asar ─────────────────────────────────────────
files:
  - dist/**/*
  - package.json

# Put the icons/tray folder next to the asar so main.ts can reach it at runtime
# via process.resourcesPath.
extraResources:
  - from: assets
    to:   assets
    filter:
      - "**/*"

# ── Protocol handler (registers fluxerworld:// in the OS) ───────────────────
# Scheme kept as `fluxerworld` so existing installs' deep links keep resolving;
# only the human-readable handler name is de-branded.
protocols:
  name: Chat
  schemes:
    - fluxerworld

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  icon: assets/icons/icon.ico
  # Prefer 64-bit; also ship arm64 if you add arm64 to the arch list below.
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  # Signed builds: set CSC_LINK / CSC_KEY_PASSWORD env vars in CI.
  # signingHashAlgorithms: [sha256]

nsis:
  oneClick:                       false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut:          true
  createStartMenuShortcut:        true
  shortcutName:                   "Chat"
  # Shown in Programs & Features
  displayLanguageSelector:        false
  installerIcon:                  assets/icons/icon.ico
  uninstallerIcon:                assets/icons/icon.ico

portable:
  # The portable exe embeds everything; no installer needed.
  artifactName: "Chat-${version}-portable-${arch}.exe"

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  icon:              assets/icons/icon.icns
  hardenedRuntime:   true
  gatekeeperAssess:  false
  entitlements:      build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisation: set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  # notarize: true
  # Arch is controlled by CI workflow flags (--x64 / --arm64) to avoid
  # hdiutil volume conflicts when building both DMGs on the same runner.
  target: dmg

dmg:
  title:    "Chat-${version}"
  iconSize: 128
  window:
    width:  540
    height: 380
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# ── Hooks ────────────────────────────────────────────────────────────────────
# After packaging the linux-x64 unpacked dir, swap the Electron binary for
# BranchBit's HEVC-enabled prebuild (gated on env HEVC_ELECTRON_DIR).
# The earlier --config.electronDist override silently no-op'd through
# electron-builder's internal pipeline; afterPack is reliable.
afterPack: build/swap-hevc-electron.js

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  icon:        assets/icons/icon.png
  category:    Network
  # Used in .desktop file
  description: "Chat desktop client"
  # No executableArgs needed. main.ts detects XDG_SESSION_TYPE at startup and
  # appendSwitches the right combination of flags per session type:
  #   - Wayland → --ozone-platform=wayland (via one-time relaunch),
  #     --use-angle=gl, --in-process-gpu, --enable-features=WaylandWindowDecorations,
  #     --disable-features=Vulkan
  #   - X11 → Vulkan ANGLE ICD detection (existing behaviour)
  # Doing it from JS instead of the launcher means terminal `fluxer-world`
  # invocations and AppImage double-clicks pick up the right flags too,
  # not just .desktop-mediated launches.
  target:
    - target: tar.gz
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64, arm64]

deb:
  afterInstall: linux/afterInstall.sh
  recommends:
    - speech-dispatcher
    - espeak-ng

rpm:
  afterInstall: linux/afterInstall.sh
  depends:
    - speech-dispatcher
    - espeak-ng

# ── Artifact naming ───────────────────────────────────────────────────────────
# Use dashes in the name to match what electron-updater writes in latest.yml.
# electron-builder converts spaces to dots for filenames but dashes for yml.
artifactName: "Chat-${version}-${os}-${arch}.${ext}"

# ── Publish (optional – configure for GitHub Releases) ───────────────────────
publish:
  provider: github
  owner: fluxerworld
  repo: fluxerworld
  releaseType: release
