<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Themes — Fluxerworld</title>
  <meta name="description" content="Community-made themes for Fluxer World. Click a theme to preview the page in it, then apply to your account.">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #0e0f11;
      --bg-card: #16181c;
      --bg-card-hover: #1c1f25;
      --border: #23262e;
      --text: #e4e4e7;
      --text-muted: #9ca3af;
      --accent: #6d8cf5;
      --accent-hover: #8ba3f8;
      --accent-subtle: rgba(109, 140, 245, 0.12);
      --radius: 12px;
      --max-w: 1120px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased; min-height: 100vh;
      transition: background 0.4s, color 0.4s;
    }
    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(14, 15, 17, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max-w); margin: 0 auto;
      padding: 0 2rem; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-weight: 700; font-size: 1.1rem; color: var(--text); }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a { color: var(--text-muted); font-size: 0.875rem; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-toggle {
      display: none; background: none; border: 0; color: var(--text);
      cursor: pointer;
    }

    .container { max-width: var(--max-w); margin: 0 auto; padding: 0 2rem; }
    .page-header {
      padding: 8rem 2rem 2rem; text-align: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(109, 140, 245, 0.08) 0%, transparent 60%);
    }
    .page-header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .page-header .subtitle { color: var(--text-muted); font-size: 1.05rem; }
    main { padding: 2rem 2rem 6rem; }

    .preview-banner {
      max-width: var(--max-w); margin: 0 auto 1.5rem; padding: 0.75rem 1rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      display: none; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .preview-banner.shown { display: flex; }
    .preview-banner .label { color: var(--text-muted); font-size: 0.875rem; }
    .preview-banner .label strong { color: var(--text); }
    .preview-banner .actions { display: flex; gap: 0.5rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex; flex-direction: column; gap: 0.75rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.05s;
    }
    .card:hover { background: var(--bg-card-hover); border-color: #2f3340; }
    .card:active { transform: translateY(1px); }
    .card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-subtle); }

    .card h3 { font-size: 1.05rem; font-weight: 700; }
    .card .author { color: var(--text-muted); font-size: 0.8rem; }
    .card .desc { color: var(--text-muted); font-size: 0.875rem; flex: 1; }

    .swatches { display: flex; gap: 4px; }
    .swatch {
      flex: 1; height: 38px; border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .tag {
      font-size: 0.7rem; padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .card-share {
      align-self: flex-end;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .card-share:hover { color: var(--accent); border-color: var(--accent); }

    .toast {
      position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--accent);
      color: var(--text); padding: 0.7rem 1.2rem; border-radius: 8px;
      font-size: 0.875rem; opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none; z-index: 200;
    }
    .toast.shown { opacity: 1; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.4rem; padding: 0.55rem 1rem; border-radius: 8px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      border: 1px solid transparent; transition: background 0.2s, border-color 0.2s;
    }
    .btn-primary {
      background: var(--accent); color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent; color: var(--text); border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--bg-card-hover); }

    .empty {
      padding: 3rem 1rem; text-align: center;
      color: var(--text-muted); font-size: 0.95rem;
      border: 1px dashed var(--border); border-radius: var(--radius);
    }

    footer {
      max-width: var(--max-w); margin: 0 auto; padding: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.875rem; text-align: center;
    }

    @media (max-width: 720px) {
      .nav-links {
        display: none; position: absolute; top: 60px; left: 0; right: 0;
        flex-direction: column; padding: 1rem 2rem; gap: 1rem;
        background: var(--bg); border-bottom: 1px solid var(--border);
      }
      .nav-links.open { display: flex; }
      .nav-toggle { display: block; font-size: 1.5rem; }
      .page-header h1 { font-size: 1.875rem; }
      .preview-banner { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">Fluxer World</a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">&#9776;</button>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/bots.html">Bots</a>
      <a href="/themes.html" class="active">Themes</a>
      <a href="/premium.html">Premium</a>
      <a href="/help.html">Help</a>
      <a href="https://github.com/fluxerworld/fluxerworld">GitHub</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <h1>Themes for Fluxer World</h1>
  <p class="subtitle">Click a theme to preview it on this page. Apply your favourite to your account.</p>
</div>

<main>
  <div class="container">
    <div id="preview-banner" class="preview-banner">
      <div class="label">Previewing <strong id="preview-name"></strong> by <span id="preview-author"></span></div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="clearPreview()">Reset</button>
        <button class="btn btn-secondary" id="share-btn" title="Copy share link">Share</button>
        <button class="btn btn-primary" id="apply-btn">Apply to my account</button>
      </div>
    </div>

    <div id="grid" class="grid"></div>
  </div>
  <div id="toast" class="toast"></div>
</main>

<footer>
  Made a theme? <a href="/submit-theme.html">Submit it</a> — community themes welcome.
</footer>

<script>
const $grid = document.getElementById('grid');
const $banner = document.getElementById('preview-banner');
const $previewName = document.getElementById('preview-name');
const $previewAuthor = document.getElementById('preview-author');
const $applyBtn = document.getElementById('apply-btn');
const $shareBtn = document.getElementById('share-btn');
const $toast = document.getElementById('toast');

// Auth state — populated on bootstrap if the user is logged in (shares
// the same localStorage token as submit-theme.html and the SPA). Drives
// which cards show the Edit button.
let currentUserIsStaff = false;
const ownedThemeIds = new Set();

function getStoredToken() {
  try { return localStorage.getItem('token') || ''; } catch { return ''; }
}
function authHeaders() {
  const t = getStoredToken();
  const headers = {'content-type': 'application/json'};
  if (t) headers['Authorization'] = t;
  return headers;
}
function canEditTheme(theme) {
  return !!theme.theme_id && (currentUserIsStaff || ownedThemeIds.has(theme.theme_id));
}

function showToast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('shown');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => $toast.classList.remove('shown'), 2200);
}

async function shareTheme(theme) {
  if (!theme || !theme.theme_id) {
    showToast('No share link available for this theme.');
    return;
  }
  const url = `${location.origin}/theme/${theme.theme_id}`;
  // Native share sheet on mobile, clipboard everywhere else.
  if (navigator.share) {
    try {
      await navigator.share({title: `${theme.name} — Fluxer theme`, text: theme.description || '', url});
      return;
    } catch (_) { /* user cancelled, fall through */ }
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Share link copied to clipboard');
  } catch {
    prompt('Copy this share link:', url);
  }
}

let activeTheme = null;
let injectedStyle = null;

// Maps a theme's Fluxer variables onto the page's own variables so
// the entire page recolours, not just the body. List the page-var ←
// theme-var pairs explicitly so nothing is forgotten.
const PREVIEW_VAR_MAP = [
  ['--bg',             '--background-primary'],
  ['--bg-card',        '--background-secondary'],
  ['--bg-card-hover',  '--background-modifier-hover'],
  ['--border',         '--border-color'],
  ['--text',           '--text-primary'],
  ['--text-muted',     '--text-secondary'],
  ['--accent',         '--brand-primary'],
  ['--accent-hover',   '--brand-primary-light'],
];

// Anything hardcoded in the page CSS (the translucent nav bg, the
// page-header gradient, accent-subtle) needs an explicit override
// once the theme bg/accent change, otherwise the dark constants
// bleed through and the preview looks half-applied.
let themedOverlay = null;

function rgbaFromCssColor(value, alpha) {
  const tmp = document.createElement('div');
  tmp.style.color = value;
  document.body.appendChild(tmp);
  const rgb = getComputedStyle(tmp).color;
  tmp.remove();
  const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(rgb);
  if (!m) return null;
  return `rgba(${m[1]}, ${m[2]}, ${m[3]}, ${alpha})`;
}

function previewTheme(theme) {
  if (injectedStyle) injectedStyle.remove();
  injectedStyle = document.createElement('style');
  injectedStyle.textContent = theme.css;
  document.head.appendChild(injectedStyle);

  const compute = getComputedStyle(document.documentElement);
  for (const [pageVar, themeVar] of PREVIEW_VAR_MAP) {
    const value = compute.getPropertyValue(themeVar).trim();
    if (value) document.documentElement.style.setProperty(pageVar, value);
  }

  // Patch the hardcoded translucent + gradient surfaces.
  if (themedOverlay) themedOverlay.remove();
  themedOverlay = document.createElement('style');
  const bg = compute.getPropertyValue('--bg').trim() || compute.getPropertyValue('--background-primary').trim();
  const accent = compute.getPropertyValue('--accent').trim() || compute.getPropertyValue('--brand-primary').trim();
  const navBg = rgbaFromCssColor(bg, 0.85) ?? bg;
  const accentTint = rgbaFromCssColor(accent, 0.12) ?? 'transparent';
  const accentGlow = rgbaFromCssColor(accent, 0.08) ?? 'transparent';
  themedOverlay.textContent = `
    nav { background: ${navBg} !important; }
    .page-header { background: radial-gradient(ellipse at 50% 0%, ${accentGlow} 0%, transparent 60%) !important; }
    .tag { background: ${accentTint} !important; color: var(--accent) !important; }
    .card.active { box-shadow: 0 0 0 2px ${accentTint} !important; }
  `;
  document.head.appendChild(themedOverlay);

  document.querySelectorAll('.card').forEach((c) => c.classList.toggle('active', c.dataset.slug === theme.slug));
  $previewName.textContent = theme.name;
  $previewAuthor.textContent = theme.author || 'unknown';
  $banner.classList.add('shown');
  activeTheme = theme;
}

function clearPreview() {
  if (injectedStyle) { injectedStyle.remove(); injectedStyle = null; }
  if (themedOverlay) { themedOverlay.remove(); themedOverlay = null; }
  for (const [pageVar] of PREVIEW_VAR_MAP) {
    document.documentElement.style.removeProperty(pageVar);
  }
  document.querySelectorAll('.card').forEach((c) => c.classList.remove('active'));
  $banner.classList.remove('shown');
  activeTheme = null;
}

$shareBtn.addEventListener('click', () => shareTheme(activeTheme));

$applyBtn.addEventListener('click', () => {
  if (!activeTheme) return;
  if (!activeTheme.theme_id) {
    alert('This theme has no server id yet; ping an admin.');
    return;
  }
  // Try the desktop app first via the custom protocol the Electron
  // build registers (fluxerworld://). If no handler is registered we
  // fall back to the website's /theme/<id> route after a short
  // timeout. Same pattern Discord/Slack use for "open in app".
  const webUrl = `/theme/${activeTheme.theme_id}`;
  const appUrl = `fluxerworld://theme/${activeTheme.theme_id}`;
  let fellBack = false;
  const fallback = setTimeout(() => {
    if (fellBack || document.hidden) return;
    fellBack = true;
    window.location.href = webUrl;
  }, 1200);
  // If the protocol handler succeeds the browser tab will lose focus
  // or be hidden — cancel the fallback in that case.
  const cancel = () => { fellBack = true; clearTimeout(fallback); };
  window.addEventListener('blur', cancel, {once: true});
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancel(); }, {once: true});
  window.location.href = appUrl;
});

function renderCards(themes) {
  if (!themes || themes.length === 0) {
    $grid.innerHTML = '<div class="empty">No themes yet. <a href="/submit-theme.html">Submit one</a> to be the first.</div>';
    return;
  }
  $grid.innerHTML = '';
  for (const theme of themes) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.slug = theme.slug;
    card.onclick = () => previewTheme(theme);

    const swatches = (theme.preview || []).map(c =>
      `<div class="swatch" style="background:${c}"></div>`
    ).join('');

    const tags = (theme.tags || []).map(t =>
      `<span class="tag">${t}</span>`
    ).join('');

    const editable = canEditTheme(theme);

    card.innerHTML = `
      <div class="swatches">${swatches}</div>
      <h3>${theme.name}</h3>
      <div class="author">by ${theme.author || 'unknown'}</div>
      <div class="desc">${theme.description || ''}</div>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${theme.theme_id ? '<button class="card-share" type="button" data-action="share">Copy link</button>' : ''}
      ${editable ? '<button class="card-share" type="button" data-action="edit">Edit</button>' : ''}
    `;
    // The share/edit buttons are children of the card; stop the click
    // from bubbling so we don't accidentally trigger the preview.
    const shareEl = card.querySelector('[data-action="share"]');
    if (shareEl) {
      shareEl.addEventListener('click', (e) => {
        e.stopPropagation();
        shareTheme(theme);
      });
    }
    const editEl = card.querySelector('[data-action="edit"]');
    if (editEl) {
      editEl.addEventListener('click', (e) => {
        e.stopPropagation();
        editTheme(theme);
      });
    }
    $grid.appendChild(card);
  }
}

// Metadata-only edit. CSS body is immutable once published (theme_id =
// sha256 of CSS) so name/description/tags are the editable surface here.
// Shown to owners (via ownedThemeIds Set) and staff.
async function editTheme(theme) {
  if (!theme.theme_id) return;
  const name = prompt('Theme name', theme.name);
  if (name === null) return;
  const description = prompt('Description', theme.description || '');
  if (description === null) return;
  const tagsStr = prompt('Tags (comma-separated, max 8)', (theme.tags || []).join(', '));
  if (tagsStr === null) return;
  const tags = tagsStr.split(',').map((s) => s.trim()).filter(Boolean).slice(0, 8);

  try {
    const r = await fetch(`/api/v1/themes/gallery/${encodeURIComponent(theme.theme_id)}`, {
      method: 'PATCH',
      credentials: 'include',
      headers: authHeaders(),
      body: JSON.stringify({name, description, tags}),
    });
    if (r.status === 401) {
      try { localStorage.removeItem('token'); localStorage.removeItem('userId'); } catch {}
      showToast('Session expired — log in via fluxer.world/app and retry.');
      return;
    }
    if (r.status === 403) {
      showToast('Not authorized to edit this theme.');
      return;
    }
    if (!r.ok) {
      showToast(`Edit failed (${r.status})`);
      return;
    }
    showToast('Theme updated');
    // Refresh the grid so the new name/desc/tags appear.
    bootstrap();
  } catch (err) {
    showToast('Edit failed — network error');
    console.error(err);
  }
}

async function bootstrap() {
  try {
    // If the user is logged in (token in localStorage, shared with the
    // SPA + submit-theme.html), also fetch their staff flag + the list
    // of themes they own. Either fetch is best-effort — failures just
    // mean no Edit button shows, which is the safe default.
    const token = getStoredToken();
    currentUserIsStaff = false;
    ownedThemeIds.clear();

    const [curatedRes, communityRes, meRes, mineRes] = await Promise.allSettled([
      fetch('/themes.json', {cache: 'no-store'}),
      fetch('/api/v1/themes/gallery', {cache: 'no-store'}),
      token ? fetch('/api/v1/users/@me', {credentials: 'include', headers: authHeaders(), cache: 'no-store'}) : Promise.resolve(null),
      token ? fetch('/api/v1/themes/gallery/mine', {credentials: 'include', headers: authHeaders(), cache: 'no-store'}) : Promise.resolve(null),
    ]);

    if (meRes.status === 'fulfilled' && meRes.value && meRes.value.ok) {
      try {
        const me = await meRes.value.json();
        currentUserIsStaff = !!me.is_staff;
      } catch {}
    }
    if (mineRes.status === 'fulfilled' && mineRes.value && mineRes.value.ok) {
      try {
        const mine = await mineRes.value.json();
        for (const t of mine.themes || []) {
          if (t.theme_id) ownedThemeIds.add(t.theme_id);
        }
      } catch {}
    }

    // Curated themes live in /themes.json; community submissions come from
    // the API. Merge both into one grid, dedupe by theme_id.
    const curated = curatedRes.status === 'fulfilled' && curatedRes.value.ok
      ? ((await curatedRes.value.json()).themes || [])
      : [];

    const community = communityRes.status === 'fulfilled' && communityRes.value.ok
      ? ((await communityRes.value.json()).themes || [])
      : [];

    const seen = new Set();
    const merged = [];
    for (const t of curated.concat(community)) {
      const id = t.theme_id;
      if (id && seen.has(id)) continue;
      if (id) seen.add(id);
      merged.push(t);
    }
    renderCards(merged);
  } catch (err) {
    $grid.innerHTML = '<div class="empty">Failed to load themes. Try again later.</div>';
    console.error(err);
  }
}

bootstrap();
</script>
</body>
</html>
