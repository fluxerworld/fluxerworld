<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bots — Fluxer World</title>
  <meta name="description" content="Browse community-built bots for Fluxer World. Add them to your server with one click.">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #0e0f11;
      --bg-card: #16181c;
      --bg-card-hover: #1c1f25;
      --border: #23262e;
      --text: #e4e4e7;
      --text-muted: #9ca3af;
      --accent: #6d8cf5;
      --accent-hover: #8ba3f8;
      --accent-subtle: rgba(109, 140, 245, 0.12);
      --green: #34d399;
      --radius: 12px;
      --max-w: 1120px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(14, 15, 17, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max-w); margin: 0 auto;
      padding: 0 2rem; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-weight: 700; font-size: 1.1rem; color: var(--text); }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a { color: var(--text-muted); font-size: 0.875rem; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .container { max-width: var(--max-w); margin: 0 auto; padding: 0 2rem; }
    .page-header {
      padding: 8rem 2rem 2rem; text-align: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(109, 140, 245, 0.08) 0%, transparent 60%);
    }
    .page-header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .page-header .subtitle { color: var(--text-muted); font-size: 1.05rem; }
    main { padding: 2rem 2rem 6rem; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
      margin-bottom: 1.5rem;
    }
    .search-input {
      flex: 1; min-width: 240px;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text); padding: 0.65rem 1rem;
      border-radius: 8px; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .sort-select {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text); padding: 0.65rem 1rem;
      border-radius: 8px; font-size: 0.9rem; cursor: pointer;
    }
    .categories {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .category-chip {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-muted); padding: 0.4rem 0.9rem;
      border-radius: 999px; font-size: 0.825rem;
      cursor: pointer; transition: all 0.15s;
      user-select: none;
    }
    .category-chip:hover {
      border-color: var(--accent); color: var(--text);
    }
    .category-chip.active {
      background: var(--accent-subtle); border-color: var(--accent);
      color: var(--accent-hover);
    }
    .category-chip .count {
      color: var(--text-muted); margin-left: 0.4rem; font-size: 0.75rem;
    }
    .bot-grid {
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }
    .bot-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
      transition: all 0.18s; display: flex; flex-direction: column;
      gap: 0.75rem; cursor: pointer; text-decoration: none; color: inherit;
    }
    .bot-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent); transform: translateY(-2px);
    }
    .bot-card-head { display: flex; align-items: center; gap: 0.85rem; }
    .bot-icon {
      width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
      background: var(--accent-subtle); display: flex;
      align-items: center; justify-content: center; font-weight: 700;
      color: var(--accent); font-size: 1.4rem; overflow: hidden;
      object-fit: cover;
    }
    .bot-name { font-weight: 700; font-size: 1.1rem; color: var(--text); }
    .bot-creator { font-size: 0.825rem; color: var(--text-muted); margin-top: 0.1rem; }
    .bot-creator .by { opacity: 0.7; }
    .bot-desc {
      color: var(--text-muted); font-size: 0.875rem; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .bot-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: auto; }
    .bot-tag {
      background: var(--accent-subtle); color: var(--accent-hover);
      padding: 0.2rem 0.6rem; border-radius: 999px;
      font-size: 0.7rem; font-weight: 500;
    }
    .empty-state {
      text-align: center; padding: 4rem 1rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .empty-state h3 { color: var(--text); margin-bottom: 0.5rem; }
    .empty-state p { color: var(--text-muted); }
    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }
    footer {
      border-top: 1px solid var(--border); padding: 2rem;
      text-align: center; color: var(--text-muted); font-size: 0.825rem;
    }
    .nav-toggle { display: none; background: none; border: none; color: var(--text); cursor: pointer; }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-links.open {
        display: flex; flex-direction: column;
        position: absolute; top: 60px; left: 0; right: 0;
        background: rgba(14, 15, 17, 0.95); backdrop-filter: blur(16px);
        padding: 1rem 2rem; gap: 1rem; border-bottom: 1px solid var(--border);
      }
      .nav-toggle { display: block; font-size: 1.5rem; }
      .page-header h1 { font-size: 1.875rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .sort-select { width: 100%; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">Fluxer World</a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">&#9776;</button>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/bots.html" class="active">Bots</a>
      <a href="/themes.html">Themes</a>
      <a href="/premium.html">Premium</a>
      <a href="/help.html">Help</a>
      <a href="https://github.com/fluxerworld/fluxerworld">GitHub</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <h1>Bots for Fluxer World</h1>
  <p class="subtitle" id="subtitle">Community-built bots you can add to your Fluxer World server.</p>
</div>

<main>
  <div class="container">
    <div class="controls">
      <input type="text" id="search" class="search-input" placeholder="Search bots by name or description…" />
      <select id="sort" class="sort-select">
        <option value="recent">Recently Added</option>
        <option value="alpha">Name (A–Z)</option>
      </select>
    </div>
    <div id="categories" class="categories"></div>
    <div id="results"></div>
  </div>
</main>

<footer>
  Want your bot listed? <a href="/submit-bot.html">List your bot</a> — closed-source welcome.
</footer>

<script>
const $search = document.getElementById('search');
const $sort = document.getElementById('sort');
const $categories = document.getElementById('categories');
const $results = document.getElementById('results');
const $subtitle = document.getElementById('subtitle');

let allBots = [];
let activeCategory = null;

function getInitials(name) {
  return name.split(/\s+/).map(s => s[0]).slice(0, 2).join('').toUpperCase();
}

function renderCard(bot) {
  const card = document.createElement('a');
  card.className = 'bot-card';
  card.href = `/bot.html?id=${encodeURIComponent(bot.slug)}`;

  const head = document.createElement('div');
  head.className = 'bot-card-head';

  const icon = bot.icon_url
    ? Object.assign(document.createElement('img'), {className: 'bot-icon', src: bot.icon_url, alt: ''})
    : Object.assign(document.createElement('div'), {className: 'bot-icon', textContent: getInitials(bot.name)});

  const meta = document.createElement('div');
  meta.style.minWidth = 0;
  const nameEl = document.createElement('div');
  nameEl.className = 'bot-name';
  nameEl.textContent = bot.name;
  meta.appendChild(nameEl);
  if (bot.creator) {
    const creator = document.createElement('div');
    creator.className = 'bot-creator';
    creator.innerHTML = `<span class="by">by</span> ${escapeHtml(bot.creator)}`;
    meta.appendChild(creator);
  }
  head.appendChild(icon);
  head.appendChild(meta);

  const desc = document.createElement('div');
  desc.className = 'bot-desc';
  desc.textContent = bot.short_description ?? '';

  card.appendChild(head);
  card.appendChild(desc);

  if (bot.tags && bot.tags.length) {
    const tags = document.createElement('div');
    tags.className = 'bot-tags';
    for (const tag of bot.tags.slice(0, 4)) {
      const t = document.createElement('span');
      t.className = 'bot-tag';
      t.textContent = tag;
      tags.appendChild(t);
    }
    card.appendChild(tags);
  }
  return card;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',
  }[c]));
}

function buildCategories(bots) {
  const counts = new Map();
  for (const b of bots) {
    for (const tag of b.tags ?? []) counts.set(tag, (counts.get(tag) ?? 0) + 1);
  }
  const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  $categories.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'category-chip' + (activeCategory == null ? ' active' : '');
  allChip.innerHTML = `All <span class="count">${bots.length}</span>`;
  allChip.onclick = () => { activeCategory = null; render(); };
  $categories.appendChild(allChip);
  for (const [tag, count] of sorted) {
    const chip = document.createElement('button');
    chip.className = 'category-chip' + (activeCategory === tag ? ' active' : '');
    chip.innerHTML = `${escapeHtml(tag)} <span class="count">${count}</span>`;
    chip.onclick = () => { activeCategory = activeCategory === tag ? null : tag; render(); };
    $categories.appendChild(chip);
  }
}

function render() {
  const query = $search.value.trim().toLowerCase();
  const sort = $sort.value;

  let bots = [...allBots];
  if (activeCategory) bots = bots.filter(b => (b.tags ?? []).includes(activeCategory));
  if (query) {
    bots = bots.filter(b =>
      b.name.toLowerCase().includes(query) ||
      (b.short_description ?? '').toLowerCase().includes(query) ||
      (b.creator ?? '').toLowerCase().includes(query),
    );
  }
  if (sort === 'alpha') {
    bots.sort((a, b) => a.name.localeCompare(b.name));
  } else {
    bots.sort((a, b) => (b.added_at ?? '').localeCompare(a.added_at ?? ''));
  }

  buildCategories(allBots);

  $results.innerHTML = '';
  if (bots.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = allBots.length === 0
      ? '<h3>No bots yet</h3><p>Check back soon, or list your own.</p>'
      : '<h3>No matches</h3><p>Try a different search or category.</p>';
    $results.appendChild(empty);
  } else {
    const grid = document.createElement('div');
    grid.className = 'bot-grid';
    for (const b of bots) grid.appendChild(renderCard(b));
    $results.appendChild(grid);
  }
}

async function load() {
  $results.innerHTML = '<div class="loading">Loading bots…</div>';
  try {
    const res = await fetch('/bots.json', {cache: 'no-store'});
    const data = await res.json();
    allBots = data.bots ?? [];
    $subtitle.textContent = `Browse ${allBots.length} community-built bot${allBots.length === 1 ? '' : 's'} you can add to your Fluxer World server.`;
    render();
  } catch (err) {
    $results.innerHTML = '<div class="empty-state"><h3>Couldn\'t load bots</h3><p>Refresh the page to try again.</p></div>';
  }
}

$search.addEventListener('input', render);
$sort.addEventListener('change', render);
load();
</script>
</body>
</html>
