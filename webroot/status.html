<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Status — Fluxer World</title>
  <meta name="description" content="Live server status for Fluxer World.">
  <style>
    :root {
      --bg: #0e0f11;
      --bg-card: #16181c;
      --bg-card-hover: #1c1f25;
      --border: #23262e;
      --text: #e4e4e7;
      --text-muted: #9ca3af;
      --accent: #6d8cf5;
      --accent-hover: #8ba3f8;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --radius: 12px;
      --max-w: 720px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(14, 15, 17, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max-w); margin: 0 auto;
      padding: 0 2rem; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-weight: 700; font-size: 1.1rem; color: var(--text); }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { color: var(--text-muted); font-size: 0.875rem; }
    .nav-links a:hover { color: var(--text); }

    /* MAIN */
    main {
      max-width: var(--max-w); margin: 0 auto;
      padding: 7rem 2rem 4rem;
    }

    h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }

    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 2.5rem; }

    /* OVERALL STATUS BANNER */
    .status-banner {
      display: flex; align-items: center; gap: 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
    }
    .status-banner .dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    }
    .status-banner .dot.healthy { background: var(--green); box-shadow: 0 0 8px rgba(52, 211, 153, 0.4); }
    .status-banner .dot.degraded { background: var(--yellow); box-shadow: 0 0 8px rgba(251, 191, 36, 0.4); }
    .status-banner .dot.down { background: var(--red); box-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
    .status-banner .dot.loading { background: var(--text-muted); animation: pulse 1.5s infinite; }
    .status-banner .label { font-size: 1.1rem; font-weight: 600; }
    .status-banner .meta { margin-left: auto; font-size: 0.8rem; color: var(--text-muted); text-align: right; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* SERVICE LIST */
    .services-label {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 0.75rem;
    }

    .service-list {
      display: flex; flex-direction: column; gap: 0.5rem;
    }

    .service-item {
      display: flex; align-items: center; gap: 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem 1.25rem;
      transition: background 0.2s;
    }
    .service-item:hover { background: var(--bg-card-hover); }

    .service-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .service-dot.healthy { background: var(--green); }
    .service-dot.degraded { background: var(--yellow); }
    .service-dot.unhealthy { background: var(--red); }
    .service-dot.disabled { background: var(--text-muted); }
    .service-dot.loading { background: var(--text-muted); animation: pulse 1.5s infinite; }

    .service-name {
      font-size: 0.95rem; font-weight: 500;
    }

    .service-detail {
      margin-left: auto; font-size: 0.8rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 0.75rem;
    }

    .service-badge {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }
    .service-badge.healthy { background: rgba(52, 211, 153, 0.1); color: var(--green); }
    .service-badge.degraded { background: rgba(251, 191, 36, 0.1); color: var(--yellow); }
    .service-badge.unhealthy { background: rgba(248, 113, 113, 0.1); color: var(--red); }
    .service-badge.disabled { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); }

    /* UPTIME INFO */
    .info-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem; margin-top: 2rem;
    }
    .info-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem; text-align: center;
    }
    .info-value {
      font-size: 1.5rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .info-label {
      font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500;
    }

    /* REFRESH */
    .refresh-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 2rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem; color: var(--text-muted);
    }
    .refresh-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-muted); padding: 0.4rem 0.9rem;
      border-radius: 6px; font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ERROR */
    .error-msg {
      background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 10px; padding: 1rem 1.25rem;
      font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;
      display: none;
    }
    .error-msg strong { color: var(--red); }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border); padding: 2rem;
      text-align: center; font-size: 0.85rem; color: var(--text-muted);
    }

    @media (max-width: 640px) {
      main { padding: 6rem 1.25rem 3rem; }
      h1 { font-size: 1.8rem; }
      .info-grid { grid-template-columns: 1fr; }
      .status-banner { flex-wrap: wrap; }
      .status-banner .meta { margin-left: 0; margin-top: 0.5rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Fluxer World</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#">Status</a>
    </div>
  </div>
</nav>

<main>

  <h1>Server Status</h1>
  <p class="subtitle">Live status of Fluxer World services.</p>

  <div class="error-msg" id="error">
    <strong>Could not reach the server.</strong> The status below may be outdated.
  </div>

  <div class="status-banner" id="banner">
    <span class="dot loading" id="banner-dot"></span>
    <span class="label" id="banner-label">Checking...</span>
    <span class="meta" id="banner-meta"></span>
  </div>

  <div class="services-label">Services</div>
  <div class="service-list" id="services">
    <!-- Populated by JS -->
  </div>

  <div class="info-grid" id="info-grid">
    <div class="info-card">
      <div class="info-value" id="uptime-value">--</div>
      <div class="info-label">Uptime</div>
    </div>
    <div class="info-card">
      <div class="info-value" id="version-value">--</div>
      <div class="info-label">Version</div>
    </div>
    <div class="info-card">
      <div class="info-value" id="latency-value">--</div>
      <div class="info-label">Latency</div>
    </div>
  </div>

  <div class="refresh-bar">
    <span id="last-checked">Last checked: --</span>
    <button class="refresh-btn" onclick="fetchStatus()">Refresh</button>
  </div>

</main>

<footer>
  <p>Fluxer World &mdash; A community instance built on the open-source <a href="https://fluxer.app">Fluxer</a> platform.</p>
</footer>

<script>
  const SERVICE_NAMES = {
    api: 'API Server',
    kv: 'Key-Value Store',
    s3: 'Object Storage',
    jetstream: 'JetStream (NATS)',
    mediaProxy: 'Media Proxy',
    admin: 'Admin Panel',
    app: 'Web Client'
  };

  const SERVICE_ORDER = ['api', 'kv', 's3', 'jetstream', 'mediaProxy', 'admin', 'app'];

  function formatUptime(seconds) {
    if (seconds < 60) return seconds + 's';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
    if (seconds < 86400) {
      var h = Math.floor(seconds / 3600);
      var m = Math.floor((seconds % 3600) / 60);
      return h + 'h ' + m + 'm';
    }
    var d = Math.floor(seconds / 86400);
    var h = Math.floor((seconds % 86400) / 3600);
    return d + 'd ' + h + 'h';
  }

  function formatTime(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) {
      return '--';
    }
  }

  function getOverallStatus(services) {
    var hasUnhealthy = false;
    var hasDegraded = false;
    for (var key in services) {
      var s = services[key].status;
      if (s === 'unhealthy') hasUnhealthy = true;
      if (s === 'degraded') hasDegraded = true;
    }
    if (hasUnhealthy) return 'down';
    if (hasDegraded) return 'degraded';
    return 'healthy';
  }

  function getOverallLabel(status) {
    if (status === 'healthy') return 'All Systems Operational';
    if (status === 'degraded') return 'Partial Degradation';
    return 'Service Disruption';
  }

  function renderServices(services) {
    var container = document.getElementById('services');
    var html = '';

    SERVICE_ORDER.forEach(function(key) {
      if (!services[key]) return;
      var svc = services[key];
      var status = svc.status;
      var name = SERVICE_NAMES[key] || key;
      var detail = '';

      if (svc.latencyMs !== undefined) {
        detail = svc.latencyMs + 'ms';
      }
      if (svc.message) {
        detail = svc.message;
      }

      html += '<div class="service-item">';
      html += '<span class="service-dot ' + status + '"></span>';
      html += '<span class="service-name">' + name + '</span>';
      html += '<span class="service-detail">';
      if (detail) html += '<span>' + detail + '</span>';
      html += '<span class="service-badge ' + status + '">' + status + '</span>';
      html += '</span>';
      html += '</div>';
    });

    container.innerHTML = html;
  }

  function renderLoading() {
    var container = document.getElementById('services');
    var html = '';
    SERVICE_ORDER.forEach(function(key) {
      html += '<div class="service-item">';
      html += '<span class="service-dot loading"></span>';
      html += '<span class="service-name">' + (SERVICE_NAMES[key] || key) + '</span>';
      html += '<span class="service-detail"><span class="service-badge disabled">checking</span></span>';
      html += '</div>';
    });
    container.innerHTML = html;
  }

  function fetchStatus() {
    var start = Date.now();
    document.getElementById('error').style.display = 'none';

    fetch('/api/v1/health', { cache: 'no-store' })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var latency = Date.now() - start;
        var overall = getOverallStatus(data.services);

        var dot = document.getElementById('banner-dot');
        dot.className = 'dot ' + (overall === 'down' ? 'down' : overall);

        document.getElementById('banner-label').textContent = getOverallLabel(overall);
        document.getElementById('banner-meta').textContent = formatTime(data.timestamp);

        renderServices(data.services);

        document.getElementById('uptime-value').textContent = formatUptime(data.uptime);
        document.getElementById('version-value').textContent = data.version || '--';
        document.getElementById('latency-value').textContent = latency + 'ms';
        document.getElementById('last-checked').textContent = 'Last checked: ' + new Date().toLocaleTimeString();
      })
      .catch(function(err) {
        document.getElementById('error').style.display = 'block';

        var dot = document.getElementById('banner-dot');
        dot.className = 'dot down';
        document.getElementById('banner-label').textContent = 'Unable to Reach Server';
        document.getElementById('banner-meta').textContent = '';

        document.getElementById('last-checked').textContent = 'Last checked: ' + new Date().toLocaleTimeString() + ' (failed)';
      });
  }

  renderLoading();
  fetchStatus();

  // Auto-refresh every 30 seconds
  setInterval(fetchStatus, 30000);
</script>

</body>
</html>
