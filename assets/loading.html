<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fluxerworld</title>
  <script>
    // Apply theme synchronously from query param BEFORE first paint to avoid
    // a flash of dark default on light/coal users. Main process injects
    // ?theme=<saved> when loading this page.
    (function () {
      try {
        var t = new URLSearchParams(location.search).get('theme');
        if (t === 'light' || t === 'dark' || t === 'coal') {
          document.documentElement.classList.add('theme-' + t);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Color tokens mirror /opt/fluxer/fluxer_app/src/styles/generated/color-system.css
     * so this preboot screen matches the SPA's SplashScreen across themes. */
    :root {
      /* Default = dark theme (matches SPA :root defaults). */
      --bg:           hsl(220, 13%, 11.18%);  /* --background-secondary */
      --text:         hsl(220, 13%, 96%);     /* --text-primary */
      --text-muted:   hsl(220, 13%, 78.18%);  /* --text-primary-muted */
      --accent:       hsl(242, 70%, 55%);     /* --brand-primary */
      --accent-hover: hsl(242, 100%, 70%);
      --danger:       hsl(0, 75%, 70%);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:           hsl(220, 10%, 92.84%);
        --text:         hsl(220, 10%, 15%);
        --text-muted:   hsl(220, 10%, 46.39%);
        --accent:       hsl(242, 70%, 55%);
        --accent-hover: hsl(242, 70%, 48%);
        --danger:       hsl(0, 75%, 50%);
      }
    }
    /* Explicit theme overrides — set by Electron when the user has a
     * known last-used theme (overrides prefers-color-scheme). */
    html.theme-light {
      --bg:           hsl(220, 10%, 92.84%);
      --text:         hsl(220, 10%, 15%);
      --text-muted:   hsl(220, 10%, 46.39%);
      --accent:       hsl(242, 70%, 55%);
      --accent-hover: hsl(242, 70%, 48%);
      --danger:       hsl(0, 75%, 50%);
    }
    html.theme-dark {
      --bg:           hsl(220, 13%, 11.18%);
      --text:         hsl(220, 13%, 96%);
      --text-muted:   hsl(220, 13%, 78.18%);
      --accent:       hsl(242, 70%, 55%);
      --accent-hover: hsl(242, 100%, 70%);
      --danger:       hsl(0, 75%, 70%);
    }
    html.theme-coal {
      --bg:           hsl(220, 13%, 1%);
      --text:         hsl(220, 13%, 96%);
      --text-muted:   hsl(220, 13%, 78.18%);
      --accent:       hsl(242, 70%, 55%);
      --accent-hover: hsl(242, 100%, 70%);
      --danger:       hsl(0, 75%, 70%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    /* Top-left brand text — matches SPA's window title placement */
    .brand-corner {
      position: fixed;
      top: 1rem;
      left: 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    /* Centered logo + (conditionally shown) status block */
    .center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
    }
    /* Matches the SPA SplashScreen: a brand-color circle pulses behind a
     * static logo. The wrapper is sized larger than the PNG so the pulse
     * halo is visible around the logo at all times (SPA uses a transparent
     * SVG, but we have an opaque PNG; sizing it down keeps the effect). */
    .logo-wrap {
      width: 7rem;
      height: 7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-color: var(--accent);
      opacity: 0.75;
      animation: splashPulse 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .logo {
      position: relative;
      z-index: 1;
      width: 5rem;
      height: 5rem;
      border-radius: 50%;
      object-fit: cover;
    }
    /* Keep animation/colors during error — only the status block changes. */
    @keyframes splashPulse {
      0% {
        transform: scale(1);
        opacity: 0.75;
      }
      75% {
        transform: scale(2);
        opacity: 0;
      }
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-wrap::before {
        animation: none;
        opacity: 0.4;
      }
    }
    /* Status block — invisible until JS un-hides it (only on error) */
    .status-block {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      max-width: 420px;
      text-align: center;
      padding: 0 1.5rem;
    }
    .status-block.show {
      display: flex;
    }
    .status-text {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
    .detail-text {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.55rem 1.4rem;
      background: var(--accent);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.97); }
    .hint {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="brand-corner">Fluxerworld</div>
  <div class="center">
    <div id="logo-wrap" class="logo-wrap">
      <img src="icons/icon.png" alt="" class="logo" />
    </div>
    <div id="status-block" class="status-block">
      <div id="status" class="status-text">Connecting…</div>
      <div id="detail" class="detail-text"></div>
      <button id="retry" class="btn">Try again</button>
      <div id="hint" class="hint"></div>
    </div>
  </div>
  <script>
    const $status      = document.getElementById('status');
    const $detail      = document.getElementById('detail');
    const $retry       = document.getElementById('retry');
    const $logoWrap    = document.getElementById('logo-wrap');
    const $hint        = document.getElementById('hint');
    const $statusBlock = document.getElementById('status-block');

    // Friendly mappings for common Chromium error codes.
    const ERROR_MAP = {
      '-3':   { status: 'Loading…', detail: '', isError: false, hideBlock: true },
      '-2':   { status: 'Connection failed',     detail: 'Unable to reach fluxer.world. Check your internet connection.' },
      '-7':   { status: 'Connection timed out',  detail: 'fluxer.world is taking too long to respond. We\'ll keep trying.' },
      '-105': { status: 'DNS lookup failed',     detail: 'Cannot resolve fluxer.world. Your DNS server may be unreachable.' },
      '-106': { status: 'No internet',           detail: 'Your computer has no internet connection. We\'ll reconnect automatically.' },
      '-109': { status: 'Network unreachable',   detail: 'Your network has no route to the internet. Check wifi or ethernet.' },
      '-118': { status: 'Connection timed out',  detail: 'fluxer.world isn\'t responding. We\'ll keep trying.' },
      '-501': { status: 'Insecure connection',   detail: 'Connection blocked. This may be a captive portal needing sign-in.' },
    };

    function setStatus({ errorCode, errorDescription, retryInMs, attempt }) {
      const map = ERROR_MAP[String(errorCode)] || {
        status: 'Connection failed',
        detail: errorDescription
          ? `Unable to load fluxer.world (${errorDescription}).`
          : 'Unable to reach fluxer.world.',
      };
      if (map.hideBlock) {
        $statusBlock.classList.remove('show');
        return;
      }
      $status.textContent = map.status;
      $detail.textContent = map.detail;
      if (map.isError === false) {
        $logoWrap.className = 'logo-wrap';
      } else {
        $logoWrap.className = 'logo-wrap error';
      }
      if (typeof retryInMs === 'number' && typeof attempt === 'number') {
        const seconds = Math.round(retryInMs / 1000);
        $hint.textContent = `Auto-retrying in ${seconds}s · attempt ${attempt}`;
      } else {
        $hint.textContent = '';
      }
      $statusBlock.classList.add('show');
    }

    function setRetrying() {
      $logoWrap.className = 'logo-wrap';
      $statusBlock.classList.remove('show');
    }

    function applyTheme(theme) {
      document.documentElement.classList.remove('theme-light', 'theme-dark', 'theme-coal');
      if (theme === 'light' || theme === 'dark' || theme === 'coal') {
        document.documentElement.classList.add('theme-' + theme);
      }
    }

    if (window.fluxerLoading) {
      window.fluxerLoading.onStatus(setStatus);
      window.fluxerLoading.onRetrying(setRetrying);
      window.fluxerLoading.onTheme(applyTheme);
      $retry.addEventListener('click', () => {
        setRetrying();
        window.fluxerLoading.retry();
      });
    }

    // ── Preview mode (browser, not Electron) ────────────────────────────
    // Append ?preview=error or ?preview=dns / ?preview=offline to see the
    // failure UI side-by-side with the SPA splash.
    const params = new URLSearchParams(location.search);
    const previewMode = params.get('preview');
    if (previewMode) {
      const themeOverride = params.get('theme');
      if (themeOverride) applyTheme(themeOverride);
      const fakeErrors = {
        offline: { errorCode: -106, errorDescription: 'ERR_INTERNET_DISCONNECTED', retryInMs: 1000, attempt: 1 },
        dns:     { errorCode: -105, errorDescription: 'ERR_NAME_NOT_RESOLVED',     retryInMs: 2000, attempt: 2 },
        timeout: { errorCode: -7,   errorDescription: 'ERR_TIMED_OUT',             retryInMs: 4000, attempt: 3 },
        error:   { errorCode: -2,   errorDescription: 'ERR_FAILED',                retryInMs: 1000, attempt: 1 },
      };
      const info = fakeErrors[previewMode] || fakeErrors.error;
      setTimeout(() => setStatus(info), 100);
      $retry.addEventListener('click', () => {
        setRetrying();
        setTimeout(() => setStatus(info), 1500);
      });
    }
  </script>
</body>
</html>
